[build]
  command = "npm install && npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Images keep stable filenames and get swapped in place, so browsers must
# revalidate (ETag, cheap 304) instead of holding a stale copy for hours.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
